services:
  web:
    build: .
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://connect4_user:connect4_pass@db:5432/connect4_db}
      - ENV=production
      - Q_TABLE_PATH=q_table.pkl
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-connect4_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-connect4_pass}
      - POSTGRES_DB=${POSTGRES_DB:-connect4_db}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-connect4_user} -d ${POSTGRES_DB:-connect4_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

