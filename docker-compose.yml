services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://connect4_user:connect4_pass@db:5432/connect4_db
      - ENV=production
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=connect4_user
      - POSTGRES_PASSWORD=connect4_pass
      - POSTGRES_DB=connect4_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
